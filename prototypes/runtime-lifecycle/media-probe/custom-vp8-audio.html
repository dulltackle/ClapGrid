<!doctype html><meta charset="utf-8"><title>自定义播放按钮对照</title><h1>自定义播放按钮对照</h1><video id="v" preload="none" src="vp8-audio.webm" width="640"></video><p><button onclick="v.play().catch(e=>out.textContent=e.message)">播放</button><button onclick="v.pause()">暂停</button><button onclick="v.currentTime=1">跳转到 1 秒</button></p><pre id="out">未播放</pre><script>const v=document.querySelector('video'),out=document.querySelector('pre');setInterval(()=>out.textContent=JSON.stringify({time:v.currentTime,duration:v.duration,paused:v.paused,error:v.error?.message,ready:v.readyState}),250);</script>
