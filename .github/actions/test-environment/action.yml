name: 准备测试环境
description: 核对预构建测试镜像，安装锁定的 npm 依赖，并记录环境和实际检出源码。
inputs:
  log-directory:
    description: 环境、源码及安装日志目录
    default: logs
runs:
  using: composite
  steps:
    - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'package-lock.json') }}
    - name: 核对并记录镜像环境
      shell: bash
      env:
        CLAPGRID_CI_LOG_DIR: ${{ inputs.log-directory }}
      run: |
        set -euo pipefail
        mkdir -p "$CLAPGRID_CI_LOG_DIR"
        git rev-parse HEAD | tee "$CLAPGRID_CI_LOG_DIR/source-commit.log"
        {
          test "$(node -p 'process.versions.node')" = "$(cat .node-version)" || { echo 'CI 镜像的 Node 版本与 .node-version 不符'; exit 1; }
          node --version
          npm --version
          "$CHROME_BIN" --version
          ffmpeg -version
          ffprobe -version
          strace -V
          fc-list :lang=zh family | grep -F 'Noto Sans CJK'
          dpkg-query -W ffmpeg fontconfig fonts-noto-cjk libass9 strace
        } 2>&1 | tee "$CLAPGRID_CI_LOG_DIR/environment.log"
    - name: 安装锁定依赖
      shell: bash
      env:
        CLAPGRID_CI_LOG_DIR: ${{ inputs.log-directory }}
      run: |
        set -o pipefail
        /usr/bin/time -v -o "$CLAPGRID_CI_LOG_DIR/npm-ci-resources.txt" npm ci 2>&1 | tee "$CLAPGRID_CI_LOG_DIR/npm-ci.log"
    - name: 核对镜像中的页面渲染浏览器
      shell: bash
      env:
        CLAPGRID_CI_LOG_DIR: ${{ inputs.log-directory }}
      run: |
        set -o pipefail
        node --input-type=module -e '
          import { chromium } from "playwright-core";
          import { pageBrowserVersion } from "./src/business/page-browser.ts";
          const browser = await chromium.launch();
          try {
            const version = browser.version();
            if (version !== pageBrowserVersion) throw new Error(`CI 镜像中的页面渲染浏览器为 ${version}，需要 ${pageBrowserVersion}`);
            console.log(`Chromium Headless Shell ${version}`);
          } finally { await browser.close(); }
        ' 2>&1 | tee -a "$CLAPGRID_CI_LOG_DIR/environment.log"
