name: 预热系统依赖缓存
on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  warm-system-packages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 生成系统依赖缓存键
        id: system-key
        shell: bash
        run: echo "key=system-debs-${ImageOS}-${ImageVersion}-$(sha256sum scripts/ci/system-packages.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: 恢复系统依赖缓存
        id: system-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .cache/system-packages/*.deb
          key: ${{ steps.system-key.outputs.key }}
      - name: 下载系统依赖（不安装）
        timeout-minutes: 5
        env:
          CLAPGRID_APT_CACHE_HIT: ${{ steps.system-cache.outputs.cache-hit || 'false' }}
        run: scripts/ci/install-system-packages.sh --download-only ffmpeg fontconfig fonts-noto-cjk strace
      - name: 保存系统依赖缓存
        if: steps.system-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .cache/system-packages/*.deb
          key: ${{ steps.system-key.outputs.key }}
      - name: 保留依赖日志（包括失败）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: system-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/system-dependencies.log
          if-no-files-found: error
          retention-days: 14
