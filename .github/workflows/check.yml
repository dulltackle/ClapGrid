name: 自动检查
on:
  pull_request:
  workflow_dispatch:
# 自动初次运行同 workflow/event/ref 替换；手动及 rerun 独占组，不让旧提交重跑取消新提交。
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') && format('isolated-{0}-{1}', github.run_id, github.run_attempt) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.run_attempt == '1' }}

permissions:
  contents: read
defaults:
  run:
    shell: bash
# 各阶段并行运行（ADR0017）；分支保护只认汇总 job `check`。
jobs:
  static:
    name: 类型检查与生产构建
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: 记录实际检出源码
        run: mkdir -p logs && git rev-parse HEAD | tee logs/source-commit.log
      - name: 安装锁定依赖
        run: /usr/bin/time -v -o logs/npm-ci-resources.txt npm ci 2>&1 | tee logs/npm-ci.log
      - name: 类型检查
        run: /usr/bin/time -v -o logs/typecheck-resources.txt npm run typecheck 2>&1 | tee logs/typecheck.log
      - name: 生产构建
        run: /usr/bin/time -v -o logs/build-resources.txt npm run build 2>&1 | tee logs/build.log
      - name: 保留完整检查日志（包括失败）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/*.log
            logs/*-resources.txt
          if-no-files-found: error
          retention-days: 14

  vitest:
    name: 全套 Vitest 逻辑与服务测试 (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/dulltackle/clapgrid-ci@sha256:9057c98d339c39d84719ee2d15a7930c77326d901699b0faedd3b1804796501b
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --shm-size=1g
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/test-environment
      - name: 全套 Vitest 逻辑与服务测试（分片）
        id: vitest
        run: /usr/bin/time -v -o logs/vitest-resources.txt node_modules/.bin/vitest run --shard=${{ matrix.shard }}/3 --reporter=default --reporter=json --outputFile.json=logs/vitest.json 2>&1 | tee logs/vitest.log
      # 只对实际启动过的阶段要求报告；失败/取消仍尝试保留原生结果。
      - name: 核对 Vitest 必需报告已保存
        if: ${{ always() && steps.vitest.outcome != '' && steps.vitest.outcome != 'skipped' }}
        run: test -s logs/vitest.json
      - name: 保留 Vitest 原生 JSON
        if: ${{ always() && steps.vitest.outcome != '' && steps.vitest.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/vitest.json
          if-no-files-found: error
          retention-days: 14
      - name: 保留完整检查日志（包括失败）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-vitest-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/*.log
            logs/*-resources.txt
          if-no-files-found: error
          retention-days: 14

  playwright:
    name: 全套 Playwright 浏览器测试 (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/dulltackle/clapgrid-ci@sha256:9057c98d339c39d84719ee2d15a7930c77326d901699b0faedd3b1804796501b
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --shm-size=1g
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/test-environment
      - name: 全套 Playwright 浏览器测试（分片）
        id: playwright
        env:
          CLAPGRID_PLAYWRIGHT_RUN_DIR: logs/playwright/ci
        run: /usr/bin/time -v -o logs/playwright-resources.txt node_modules/.bin/playwright test --shard=${{ matrix.shard }}/2 2>&1 | tee logs/playwright.log
      - name: 核对 Playwright 必需报告已保存
        if: ${{ always() && steps.playwright.outcome != '' && steps.playwright.outcome != 'skipped' }}
        run: |
          test -s logs/playwright/ci/report.json
          test -s logs/playwright/ci/report/index.html
      - name: 保留 Playwright 原生报告和失败附件
        if: ${{ always() && steps.playwright.outcome != '' && steps.playwright.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/playwright/ci/report.json
            logs/playwright/ci/report/
            logs/playwright/ci/results/
          if-no-files-found: error
          retention-days: 14
      - name: 保留完整检查日志（包括失败）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-playwright-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/*.log
            logs/*-resources.txt
          if-no-files-found: error
          retention-days: 14

  # 必需检查名保持 `check`；任一阶段失败、取消或跳过都使其失败，不把未执行当通过。
  check:
    if: always()
    needs: [static, vitest, playwright]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 汇总各阶段结果
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
