name: 自动检查
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# 自动初次运行同 workflow/event/ref 替换；手动及 rerun 独占组，不让旧提交重跑取消新提交。
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') && format('isolated-{0}-{1}', github.run_id, github.run_attempt) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.run_attempt == '1' }}

permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: 记录作业观察起点
        run: echo "CLAPGRID_CI_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: 准备媒体工具与中文字体
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          { sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-noto-cjk; } 2>&1 | tee logs/system-dependencies.log
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        id: chrome
        with:
          chrome-version: '131.0.6778.204'
          install-dependencies: true
      - name: 记录环境
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -o pipefail
          { node --version; npm --version; "$CHROME_BIN" --version; ffmpeg -version; ffprobe -version; fc-list :lang=zh family; dpkg-query -W ffmpeg fontconfig fonts-noto-cjk libass9; } 2>&1 | tee logs/environment.log
      - name: 记录实际检出源码
        run: git rev-parse HEAD | tee logs/source-commit.log
      - name: 安装锁定依赖
        run: /usr/bin/time -v -o logs/npm-ci-resources.txt npm ci 2>&1 | tee logs/npm-ci.log
      - name: 类型检查
        run: /usr/bin/time -v -o logs/typecheck-resources.txt npm run typecheck 2>&1 | tee logs/typecheck.log
      - name: 全套 Vitest 逻辑与服务测试
        id: vitest
        run: /usr/bin/time -v -o logs/vitest-resources.txt node_modules/.bin/vitest run --reporter=default --reporter=json --outputFile.json=logs/vitest.json 2>&1 | tee logs/vitest.log
      - name: 全套 Playwright 浏览器测试
        id: playwright
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: /usr/bin/time -v -o logs/playwright-resources.txt node_modules/.bin/playwright test 2>&1 | tee logs/playwright.log
      - name: 生产构建
        run: /usr/bin/time -v -o logs/build-resources.txt npm run build 2>&1 | tee logs/build.log
      # 只对实际启动过的阶段要求报告；失败/取消仍尝试保留原生结果。
      - name: 核对 Vitest 必需报告已保存
        if: ${{ always() && steps.vitest.outcome != '' && steps.vitest.outcome != 'skipped' }}
        run: test -s logs/vitest.json
      - name: 保留 Vitest 原生 JSON
        if: ${{ always() && steps.vitest.outcome != '' && steps.vitest.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/vitest.json
          if-no-files-found: error
          retention-days: 14
      - name: 核对 Playwright 必需报告已保存
        if: ${{ always() && steps.playwright.outcome != '' && steps.playwright.outcome != 'skipped' }}
        run: |
          test -s logs/playwright.json
          test -s logs/playwright-report/index.html
      - name: 保留 Playwright 原生报告和失败附件
        if: ${{ always() && steps.playwright.outcome != '' && steps.playwright.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/playwright.json
            logs/playwright-report/
            logs/playwright-results/
          if-no-files-found: error
          retention-days: 14
      - name: 记录 CI 状态、耗时及作业余量
        if: always()
        env:
          CLAPGRID_CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-observation.mjs --output logs/ci-timing.json --timeout-minutes 60 --status "$CLAPGRID_CI_JOB_STATUS"
      - name: 保留完整检查日志（包括失败）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/ci-timing.json
            logs/*.log
            logs/*-resources.txt
          if-no-files-found: error
          retention-days: 14
