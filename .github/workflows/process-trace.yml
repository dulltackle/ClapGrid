name: Linux 导出拒绝进程追踪

on:
  pull_request:
  workflow_dispatch:

# 自动初次运行同 workflow/event/ref 替换；手动及 rerun 独占组，不让旧提交重跑取消新提交。
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') && format('isolated-{0}-{1}', github.run_id, github.run_attempt) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.run_attempt == '1' }}

permissions:
  contents: read

jobs:
  process-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/dulltackle/clapgrid-ci@sha256:9057c98d339c39d84719ee2d15a7930c77326d901699b0faedd3b1804796501b
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # 仅进程追踪作业需要追踪容器内子进程。
      options: --init --shm-size=1g --cap-add=SYS_PTRACE
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/test-environment
        with:
          log-directory: .cache/process-trace
      - name: 验证拒绝窗口及真实 FFmpeg 正向对照
        run: node scripts/verify-speech-export-processes.mjs .cache/process-trace
      - name: 发布结果摘要
        if: always()
        run: |
          mkdir -p .cache/process-trace
          if [ ! -f .cache/process-trace/summary.md ]; then
            printf '%s\n' '# Linux 导出拒绝进程追踪' '' '未执行：前置安装或工作流步骤失败；请检查作业日志和 environment.log/npm-ci.log。' '' '受控供应商测试，不作为真实供应商或宿主验收。' > .cache/process-trace/summary.md
          fi
          cat .cache/process-trace/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: 留存原始追踪、测试日志和结果摘要
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-process-trace-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/process-trace/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
